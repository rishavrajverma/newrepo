<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Data Tables</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet" />

    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 500px;
      }

      #accordionData {
        margin: 20px 30px;
      }

      .accordion-item {
        border-radius: 0.75rem;
        margin-bottom: 1.5rem;
        overflow: hidden;
        border: 1px solid #dee2e6;
      }
      .accordion-header {
        position: relative;
      }

      .center-scroll-buttons {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 3;
      }
      .accordion-button {
        font-weight: 600;
        cursor: pointer;
        box-shadow: none !important;
        height: auto;
        color: #3d3d3d !important;
        font-size: 18px;
        background-color: #f8f9fa !important;
        margin: -1px;
        z-index: 2;
        position: relative;
      }
      .accordion-button::after {
        display: none;
      }
      .accordion-num {
        color: #7a7a7a;
      }

      .scroll-btn {
        background: transparent;
        border: none;
        z-index: 5;
        width: 30px;
        height: 40px;
        margin-left: 2px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .accordion-button.collapsed {
        border-radius: 0.75rem !important;
        border: 1px solid #f8f9fa;
      }

      .accordion-button:not(.collapsed) {
        border-bottom-left-radius: 0 !important;
        border-bottom-right-radius: 0 !important;
      }

      .accordion-body {
        padding: 0%;
        background-color: #fff;
      }

      .table-wrapper {
        max-height: 200px;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .table-horizontal-scroll {
        overflow-x: auto;
        position: relative;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .table-horizontal-scroll::-webkit-scrollbar {
        display: none;
      }

      table {
        width: max-content;
        border-collapse: collapse;
        font-family: Rubik;
      }

      th,
      td {
        padding: 4px 10px;
        text-align: center;
        white-space: nowrap;
        width: 90px;
      }

      th {
        cursor: pointer;
        padding: 12px;
        font-size: 14px;
        font-weight: 600;
        color: #3d3d3d;
        background-color: #f5f5f5;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      td {
        font-size: 13px;
        font-weight: 500;
      }
      tbody > tr {
      }

      th i {
        margin-left: 5px;
        cursor: pointer;
        font-size: 0.8em;
        color: #888;
      }

      .sticky-col {
        position: sticky;
        background-color: white;
        z-index: 2;
        box-shadow: 2px 0 5px -2px rgba(0, 0, 0, 0.1);
      }

      .sticky-col-1 {
        left: 0;
        z-index: 3;
      }

      .sticky-col-2 {
        left: 140px;
      }

      .sticky-col-3 {
        left: 230px;
      }

      .sticky-col-4 {
        left: 330px;
      }

      .sticky-col-5 {
        left: 430px;
      }
      .sticky-col-6 {
        left: 500px;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <div class="accordion" id="accordionData"></div>
    </div>

    <script>
      const jsonData = {
        CDG: {
          Compliance: "c1",
          Delays: "d1",
          Provisioning: "p1",
          Quality: "q1",
          Safety: "s1",
          Unclassified: "u1",
          city: "Paris",
          caterer: "Caterer1",
          closedCount: "cc1",
          country: "France",
          totalCount: "t1",
          unresolvedCount: "ut1",
          test1: "test1",
          test2: "test2",
          test3: "test3",
          test4: "test4",
          test5: "test5",
          test6: "test6",
        },
        FCO: {
          Compliance: 1,
          Delays: 0,
          Provisioning: 0,
          Quality: 1,
          Safety: 0,
          Unclassified: 0,
          city: "Rome",
          caterer: "Caterer2",
          closedCount: 0,
          country: "Italy",
          totalCount: 2,
          unresolvedCount: 2,
          test1: "test1",
          test2: "test2",
          test3: "test3",
          test4: "test4",
          test5: "test5",
          test6: "test6",
        },
        NCE: {
          Compliance: 0,
          Delays: 0,
          Provisioning: 0,
          Quality: 1,
          Safety: 0,
          Unclassified: 0,
          city: "Nice",
          caterer: "Caterer3",
          closedCount: 0,
          country: "France",
          totalCount: 1,
          unresolvedCount: 1,
          test1: "test1",
          test2: "test2",
          test3: "test3",
          test5: "test5",
          test4: "test4",
          test6: "test6",
        },
        YQB: {
          Compliance: 0,
          Delays: 0,
          Provisioning: 0,
          Quality: 0,
          Safety: 0,
          Unclassified: 10,
          city: "Quebec City",
          caterer: "Caterer4",
          closedCount: 0,
          country: "Canada",
          totalCount: 10,
          unresolvedCount: 10,
          test1: "test1",
          test2: "test2",
          test3: "test3",
          test4: "test4",
          test5: "test5",
          test6: "test6",
        },
        YUL: {
          Compliance: 0,
          Delays: 0,
          Provisioning: 0,
          Quality: 0,
          Safety: 0,
          Unclassified: 37,
          city: "Montreal",
          caterer: "Caterer5",
          closedCount: 0,
          country: "Canada",
          totalCount: 37,
          unresolvedCount: 37,
          test1: "test1",
          test2: "test2",
          test3: "test3",
          test4: "test4",
          test5: "test5",
          test6: "test6",
        },
        YVR: {
          Compliance: 0,
          Delays: 0,
          Provisioning: 0,
          Quality: 1,
          Safety: 0,
          Unclassified: 1,
          city: "Vancouver",
          caterer: "Caterer6",
          closedCount: 0,
          country: "Canada",
          totalCount: 2,
          unresolvedCount: 2,
          test1: "test1",
          test2: "test2",
          test3: "test3",
          test4: "test4",
          test5: "test5",
          test6: "test6",
        },
        YXU: {
          Compliance: 0,
          Delays: 0,
          Provisioning: 0,
          Quality: 0,
          Safety: 0,
          Unclassified: 5,
          city: "London",
          caterer: "Caterer7",
          closedCount: 0,
          country: "Canada",
          totalCount: 5,
          unresolvedCount: 5,
          test1: "test1",
          test2: "test2",
          test3: "test3",
          test4: "test4",
          test5: "test5",
          test6: "test6",
        },
        YYZ: {
          Compliance: 0,
          Delays: 0,
          Provisioning: 0,
          Quality: 0,
          Safety: 0,
          Unclassified: 79,
          city: "Toronto",
          caterer: "Caterer8",
          closedCount: 0,
          country: "Canada",
          totalCount: 79,
          unresolvedCount: 79,
          test1: "test1",
          test2: "test2",
          test3: "test3",
          test4: "test4",
          test5: "test5",
          test6: "test6",
        },
      };

      const groupedByCountry = {};
      for (const station in jsonData) {
        const entry = jsonData[station];
        const country = entry.country;
        if (!groupedByCountry[country]) groupedByCountry[country] = [];
        groupedByCountry[country].push({ station, ...entry });
      }

      const accordion = document.getElementById("accordionData");
      let index = 0;

      for (const country in groupedByCountry) {
        const data = groupedByCountry[country];
        const preferredOrder = [
          "actions",
          "station",
          "city",
          "caterer",
          "unresolvedCount",
          "closedCount",
          "totalCount",
          "Delays",
          "Quality",
          "Compliance",
          "Provisioning",
          "Unclassified",
          "Safety",
        ];
        const sampleEntry = data[0];
        const dynamicKeys = Object.keys(sampleEntry).filter(
          (key) =>
            !["country"].concat(preferredOrder).includes(key) &&
            key !== "actions"
        );

        const finalKeys = [...preferredOrder, ...dynamicKeys, "actions"];

        const sortableKeys = ["station", "city", "caterer"];

        const thead = finalKeys
          .map((key, i) => {
            const stickyClass = i < 6 ? `sticky-col sticky-col-${i + 1}` : "";
            const sortableClass = sortableKeys.includes(key.toLowerCase())
              ? "sortable"
              : "";
            let label = key.charAt(0).toUpperCase() + key.slice(1);
            if (key === "station") label = "Station Code";
            if (key === "unresolvedCount") label = "Unresolved";
            if (key === "closedCount") label = "Closed";
            if (key === "totalCount") label = "Total";
            if (key === "actions") label = "Action";
            return `
          <th class="${sortableClass} ${stickyClass}" data-key="${key}" style="width: 50px;">
            <div class="d-inline-flex align-items-center gap-1 justify-content-center">
              <span>${label}</span>
              ${sortableClass ? `<i class="fas fa-sort"></i>` : ""}
            </div>
          </th>`;
          })
          .join("");

        const tbody = data
          .map(
            (row) => `
        <tr>
          ${finalKeys
            .map((key, i) => {
              const stickyClass = i < 6 ? `sticky-col sticky-col-${i + 1}` : "";
              let value = row[key] ?? "";
              if (key === "actions") {
                const paramObj = {
                  action: "NavigateRelatedIssues",
                  station: row.station,
                };
                const paramJSON = JSON.stringify(paramObj).replace(/"/g, '\\"');

                value = `<button type="button" 
                
               onclick='FileMaker.PerformScript("RandomOperations", "${paramJSON}")'   
                
              


 class="btn btn-sm">
    <i class="fa-solid fa-arrow-right" style="transform: rotate(300deg); color: #641BFD;"></i>
  </button>`;
              }

              return `<td class="${stickyClass}">${value}</td>`;
            })
            .join("")}
        </tr>`
          )
          .join("");

        const accordionItem = document.createElement("div");
        accordionItem.className = "accordion-item";
        const collapseId = `collapse-${index}`;
        const countryId = `country-${index}`;
        accordionItem.innerHTML = `
        <h2 class="accordion-header" id="${countryId}">
          <div class="d-flex align-items-center justify-content-between w-100" style="background-color: #f8f9fa;">
            <button class="accordion-button d-flex align-items-center gap-3" type="button"
              data-bs-toggle="collapse" data-bs-target="#${collapseId}" aria-controls="${collapseId}">
              <span class="fw-semibold">${country}</span>
              <span class="accordion-num text-muted">(${data.length})</span>
            </button>
            <button class="scroll-btn btn btn-sm" type="button" data-direction="right">
              <i class="fas fa-chevron-right"></i>
            </button>
          </div>
        </h2>
        <div id="${collapseId}" class="accordion-collapse collapse show" aria-labelledby="${countryId}">
          <div class="accordion-body">
            <div class="table-wrapper">
              <div class="table-horizontal-scroll">
                <table class="sortable-table" data-country="${country}">
                  <thead><tr>${thead}</tr></thead>
                  <tbody>${tbody}</tbody>
                </table>
              </div>
            </div>
          </div>
        </div>`;
        accordion.appendChild(accordionItem);
        index++;
      }

      document.addEventListener("click", function (e) {
        const th = e.target.closest("th[data-key]");
        if (!th) return;
        const key = th.dataset.key;
        const table = th.closest("table");
        const tbody = table.querySelector("tbody");
        const rows = Array.from(tbody.querySelectorAll("tr"));
        const ascending = th.dataset.order !== "asc";
        th.dataset.order = ascending ? "asc" : "desc";
        const colIndex = Array.from(th.parentNode.children).indexOf(th);
        rows.sort((a, b) => {
          const aText = a.children[colIndex].textContent.trim().toLowerCase();
          const bText = b.children[colIndex].textContent.trim().toLowerCase();
          return ascending
            ? aText.localeCompare(bText)
            : bText.localeCompare(aText);
        });
        tbody.innerHTML = "";
        rows.forEach((row) => tbody.appendChild(row));
      });

      // Scroll buttons
      document.addEventListener("click", function (e) {
        if (e.target.closest(".scroll-btn")) {
          const btn = e.target.closest(".scroll-btn");
          const direction = btn.getAttribute("data-direction");
          const container = btn
            .closest(".accordion-item")
            .querySelector(".table-horizontal-scroll");
          if (!container) return;
          container.scrollBy({
            left: direction === "left" ? -200 : 200,
            behavior: "smooth",
          });
        }
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
