<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Data Tables</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <style>
      body {
  margin: 0;
  padding: 0;
  min-height: 500px;
}

#accordionData {
  margin:10px 10px;
  margin-left: 10px;
  margin-right: 15px;
}

.accordion-item {
  border-radius: 0.75rem;
  margin-bottom: 1.5rem;
  overflow: hidden;
  border: 1px solid #dee2e6;
}

.accordion-button {
  cursor: pointer;
  box-shadow: none !important;
  height: 52px !important;
  background-color: #f8f9fa !important;
  border-radius: 0.75rem !important;
  margin: -1px; 
  z-index: 2;
  position: relative;
}

.accordion-button.collapsed {
  border-radius: 0.75rem !important;
  border: 1px solid #f8f9fa;
}

.accordion-button:not(.collapsed) {
  border-bottom-left-radius: 0 !important;
  border-bottom-right-radius: 0 !important; 
  border-top-left-radius: 14px !important;
  border-top-right-radius: 14px !important;
  
}

.accordion-button:focus {
  outline: none !important;
  box-shadow: none !important;
}

.accordion-body {
  background-color: #fff;
  border-bottom-left-radius: 0.75rem;
  border-bottom-right-radius: 0.75rem;
  border-top: 1px solid #dee2e6;
}

.table-wrapper {
  overflow: hidden;
  max-height: 200px;
  overflow-y: auto;
}

th i {
  margin-left: 5px;
  cursor: pointer;
  font-size: 0.8em;
  color: #888;
}

.tight-icons {
  line-height: 0.8;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px 10px;
  text-align: center;
  white-space: nowrap;
}

th {
  background-color: #f5f5f5;
  position: sticky;
  top: 0;
  z-index: 1;
}

      </style>
</head>
<body>
  <div class="accordion" id="accordionData"></div>

  <script>
    const jsonData = {
  "CDG": {
    "Compliance": 0,
    "Delays": 0,
    "Provisioning": 1,
    "Quality": 0,
    "Safety": 0,
    "Unclassified": 0,
    "city": "Paris",
    "closedCount": 0,
    "country": "France",
    "totalCount": 1,
    "unresolvedCount": 1
  },
  "FCO": {
    "Compliance": 1,
    "Delays": 0,
    "Provisioning": 0,
    "Quality": 1,
    "Safety": 0,
    "Unclassified": 0,
    "city": "Rome",
    "closedCount": 0,
    "country": "Italy",
    "totalCount": 2,
    "unresolvedCount": 2
  },
  "NCE": {
    "Compliance": 0,
    "Delays": 0,
    "Provisioning": 0,
    "Quality": 1,
    "Safety": 0,
    "Unclassified": 0,
    "city": "Nice",
    "closedCount": 0,
    "country": "France",
    "totalCount": 1,
    "unresolvedCount": 1
  },
  "YQB": {
    "Compliance": 0,
    "Delays": 0,
    "Provisioning": 0,
    "Quality": 0,
    "Safety": 0,
    "Unclassified": 10,
    "city": "Quebec City",
    "closedCount": 0,
    "country": "Canada",
    "totalCount": 10,
    "unresolvedCount": 10
  },
  "YUL": {
    "Compliance": 0,
    "Delays": 0,
    "Provisioning": 0,
    "Quality": 0,
    "Safety": 0,
    "Unclassified": 37,
    "city": "Montreal",
    "closedCount": 0,
    "country": "Canada",
    "totalCount": 37,
    "unresolvedCount": 37
  },
  "YVR": {
    "Compliance": 0,
    "Delays": 0,
    "Provisioning": 0,
    "Quality": 1,
    "Safety": 0,
    "Unclassified": 1,
    "city": "Vancouver",
    "closedCount": 0,
    "country": "Canada",
    "totalCount": 2,
    "unresolvedCount": 2
  },
  "YXU": {
    "Compliance": 0,
    "Delays": 0,
    "Provisioning": 0,
    "Quality": 0,
    "Safety": 0,
    "Unclassified": 5,
    "city": "London",
    "closedCount": 0,
    "country": "Canada",
    "totalCount": 5,
    "unresolvedCount": 5
  },
  "YYZ": {
    "Compliance": 0,
    "Delays": 0,
    "Provisioning": 0,
    "Quality": 0,
    "Safety": 0,
    "Unclassified": 79,
    "city": "Toronto",
    "closedCount": 0,
    "country": "Canada",
    "totalCount": 79,
    "unresolvedCount": 79
  }
};

    const groupedByCountry = {};
    for (const station in jsonData) {
      const entry = jsonData[station];
      const country = entry.country;
      if (!groupedByCountry[country]) {
        groupedByCountry[country] = [];
      }
      groupedByCountry[country].push({ code: station, ...entry });
    }

    const accordion = document.getElementById('accordionData');
    let index = 0;

    for (const country in groupedByCountry) {
      const countryId = `country-${index}`;
      const collapseId = `collapse-${index}`;
      const data = groupedByCountry[country];
      const accordionItem = document.createElement('div');
      accordionItem.className = 'accordion-item';
      accordionItem.innerHTML = `
        <h2 class='accordion-header' id='${countryId}'>
          <button class='accordion-button ${index !== 0 ? 'collapsed' : ''}' type='button' data-bs-toggle='collapse' data-bs-target='#${collapseId}' aria-expanded='${index === 0}' aria-controls='${collapseId}'>
            ${country} <span style='margin-left: 3px; font-weight: normal;'>(${data.length})</span>
          </button>
        </h2>
        <div id='${collapseId}' class='accordion-collapse collapse ${index === 0 ? 'show' : ''}' aria-labelledby='${countryId}' data-bs-parent='#accordionData'>
          <div class='accordion-body'>
            <div class='table-wrapper'>
              <table data-country='${country}' class='sortable-table'>
                <thead class='text-center align-middle'>
                  <tr>
                    <th class='sortable align-middle' data-key='stationcode'>
                      <div class='d-inline-flex align-items-center gap-1 justify-content-center'>
                        <span>Station Code</span>
                        <div class='d-flex flex-column'>
                          <i class='fa-solid fa-angle-up small tight-icons'></i>
                          <i class='fa-solid fa-angle-down small tight-icons'></i>
                        </div>
                      </div>
                    </th>
                    <th class='sortable align-middle' data-key='city'>City</th>
                    <th class='sortable align-middle' data-key='country'>Country</th>
                    <th>Compliance</th>
                    <th>Delays</th>
                    <th>Provisioning</th>
                    <th>Quality</th>
                    <th>Safety</th>
                    <th>Unclassified</th>
                    <th>Closed</th>
                    <th>Unresolved</th>
                    <th>Total</th>
                  </tr>
                </thead>
                <tbody>
                  ${data.map(row => `
                    <tr>
                      <td>${row.code}</td>
                      <td>${row.city}</td>
                      <td>${row.country}</td>
                      <td>${row.Compliance}</td>
                      <td>${row.Delays}</td>
                      <td>${row.Provisioning}</td>
                      <td>${row.Quality}</td>
                      <td>${row.Safety}</td>
                      <td>${row.Unclassified}</td>
                      <td>${row.closedCount}</td>
                      <td>${row.unresolvedCount}</td>
                      <td>${row.totalCount}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
      accordion.appendChild(accordionItem);
      index++;
    }

    document.addEventListener('click', function (e) {
      const th = e.target.closest('th.sortable');
      if (!th) return;
      const key = th.dataset.key;
      const table = th.closest('table');
      const tbody = table.querySelector('tbody');
      const rows = Array.from(tbody.querySelectorAll('tr'));
      const ascending = th.dataset.order !== 'asc';
      th.dataset.order = ascending ? 'asc' : 'desc';
      const colIndex = th.cellIndex;
      rows.sort((a, b) => {
        const aText = a.children[colIndex].textContent.trim().toLowerCase();
        const bText = b.children[colIndex].textContent.trim().toLowerCase();
        return ascending ? aText.localeCompare(bText) : bText.localeCompare(aText);
      });
      tbody.innerHTML = '';
      rows.forEach(row => tbody.appendChild(row));
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
