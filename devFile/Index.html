<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Interactive Semi Arc KPI Gauge</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/highcharts-more.js"></script>
    <script src="https://code.highcharts.com/modules/solid-gauge.js"></script>
    <style>
      body {
        font-family: "Rubik", sans-serif;
        padding: 20px;
        background: #f9f9f9;
      }
      #combinedGauge {
        width: 100%;
        height: 200px;
        margin: auto;
      }
      #infoBox {
        text-align: center;
        margin-top: 20px;
        font-size: 16px;
        padding: 10px;
        border-top: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <div id="combinedGauge"></div>

    <script>
      const jsonData = {
        gauges: [
          { issues: 0, title: "Delays", value: 0 },
          { issues: 3, title: "Quality", value: 1.5 },
          { issues: 1, title: "Compliance", value: 0.5 },
          { issues: 1, title: "Provisioning", value: 0.5 },
          { issues: 199, title: "Unclassified", value: 97.1 },
          { issues: 1, title: "Safety", value: 0.5 },
          { issues: 0, title: "Test", value: 0 },
          { issues: 2, title: "Monitoring", value: 25 },
          { issues: 4, title: "Performance", value: 40 },
          { issues: 1, title: "Backup", value: 60 },
        ],
      };

      const gaugeCount = jsonData.gauges.length;
      const maxRadius = 100;
      const minRadius = 10;
      const arcGap = Math.max((maxRadius - minRadius) / gaugeCount, 4);

      const chartSeries = [];
      const chartPaneBackground = [];

      jsonData.gauges.forEach((item, i) => {
        const outerRadius = maxRadius - i * arcGap;
        const innerRadius = outerRadius - (arcGap - 1);

        chartPaneBackground.push({
          outerRadius: outerRadius + "%",
          innerRadius: innerRadius + "%",
          backgroundColor: "#eee",
          shape: "arc",
          borderWidth: 0,
        });

        chartSeries.push({
          name: item.title,
          data: [
            {
              y: item.value,
              custom: { issues: item.issues },
            },
          ],
          radius: outerRadius + "%",
          innerRadius: innerRadius + "%",
          dataLabels: {
            enabled: false,
          },
          point: {
            events: {
              click: function () {
                document.getElementById("infoBox").innerHTML = `
                  <strong>${item.title}</strong><br/>
                  Value: ${item.value}%<br/>
                  Issues: ${item.issues}
                `;
              },
            },
          },
        });
      });

      Highcharts.chart("combinedGauge", {
        chart: {
          type: "solidgauge",
        },
        title: null,
        tooltip: {
          enabled: true,
          formatter: function () {
            return `
              <b>${this.series.name}</b><br/>
              Value: ${this.y}%<br/>
              Issues: ${this.point.custom.issues}
            `;
          },
        },
        pane: {
          center: ["50%", "100%"],
          size: "200%",
          startAngle: -90,
          endAngle: 90,
          background: chartPaneBackground,
        },
        yAxis: {
          min: 0,
          max: 100,
          lineWidth: 0,
          tickPositions: [],
        },
        plotOptions: {
          solidgauge: {
            borderColor: null,
            trackByArea: true,
            stickyTracking: false,
            states: {
              hover: {
                brightness: 0.1,
              },
            },
            dataLabels: {
              useHTML: true,
            },
          },
        },
        series: chartSeries,
        credits: {
          enabled: false,
        },
      });
    </script>
  </body>
</html>
